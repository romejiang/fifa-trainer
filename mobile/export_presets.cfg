; 安卓导出预设：键名取自 4.7.2 源码 editor/export/editor_export.cpp:40-121。
; 签名凭据相关的键一个都不写 —— 4.7.2 把它们标成 SECRET，编辑器一保存就会搬进
; res://.godot/export_credentials.cfg；凭据只走环境变量（见 mobile/BUILD.md）。
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; .json 在 4.7.2 已是注册资源扩展名，会自动入包；.sha256 不是资源，不加进
; include_filter 就会被静默丢弃（RESEARCH P5）。
include_filter="assets/config/*.json,assets/config/*.sha256"
exclude_filter="build/*,tools/*.png"
export_path="build/fifa-trainer.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; 只出 arm64-v8a：成功标准 1 写死 arm64；混入 x86_64 是闸门 B 的失败条件。
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; 与桌面版 desktop/build/build_macos.sh:22 的 --osx-bundle-identifier 同一身份。
; 这个值一旦发给朋友就不能改（改了 = 另一个 app + 数据全丢）。
package/unique_name="com.fifaskill.trainer"
package/name="FIFA 花式动作练习器"
package/signed=true
version/code=1
version/name="0.1.0"
permissions/vibrate=true
